name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: DATABASE_URL=sqlite:////tmp/legiswatch-ci.db alembic upgrade head
      - run: DATABASE_URL=sqlite:////tmp/legiswatch-ci.db alembic check
      - run: DATABASE_URL=sqlite:////tmp/legiswatch-ci.db python -m app.db.migrate check
      - run: pytest -q
      - run: node --test tests/test_weekly_dashboard.js
