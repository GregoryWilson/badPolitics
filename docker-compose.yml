services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: legiswatch
      POSTGRES_USER: legiswatch
      POSTGRES_PASSWORD: legiswatch
    ports: ["5432:5432"]
    volumes: ["legiswatch_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legiswatch"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://legiswatch:legiswatch@db:5432/legiswatch
      CONGRESS_API_KEY: ${CONGRESS_API_KEY:-}
      GOVINFO_API_KEY: ${GOVINFO_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3:14b}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      AUTO_DISCOVERY_ENABLED: ${AUTO_DISCOVERY_ENABLED:-true}
      AUTO_DISCOVERY_MINUTES: ${AUTO_DISCOVERY_MINUTES:-60}
      AUTO_DISCOVERY_BATCH_SIZE: ${AUTO_DISCOVERY_BATCH_SIZE:-50}
      AUTO_DISCOVERY_US_CONGRESS: ${AUTO_DISCOVERY_US_CONGRESS:-119}
      AUTO_DISCOVERY_TX_SESSIONS: ${AUTO_DISCOVERY_TX_SESSIONS:-89R}
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  legiswatch_pg:
