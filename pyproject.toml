[project]
name = "legiswatch"
version = "0.1.0"
description = "Evidence-first legislative monitoring and analysis"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.7",
  "httpx>=0.28",
  "beautifulsoup4>=4.12",
  "lxml>=5.3",
  "python-multipart>=0.0.20",
  "alembic>=1.14",
  "pypdf>=5.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["migrations*"]
